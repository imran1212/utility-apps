name: Build Image Compressor (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos and bootstrap workspace
        run: |
          dart pub global activate melos 6.3.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          melos bootstrap

      - name: Generate Android project files if missing
        working-directory: apps/image_compressor
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.utilityapps .
          fi

      - name: Configure app label, gallery permission and AdMob test app ID
        working-directory: apps/image_compressor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if 'android:label="image_compressor"' in text:
              text = text.replace('android:label="image_compressor"', 'android:label="Image Compressor"')
          permission = '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />'
          if permission not in text:
              text = text.replace("<application", f"    {permission}\\n    <application", 1)
          marker = "com.google.android.gms.ads.APPLICATION_ID"
          if marker not in text:
              meta = """
                  <!-- Google sample AdMob app ID. Replace before production release. -->
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713" />
              """
              text = text.replace("</application>", meta + "\\n    </application>")
          manifest.write_text(text)
          PY

      - name: Analyze and test
        working-directory: apps/image_compressor
        run: |
          flutter pub get
          flutter analyze
          if [ -d test ]; then flutter test; fi

      - name: Build APK and AAB
        working-directory: apps/image_compressor
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-compressor-android-builds
          path: |
            apps/image_compressor/build/app/outputs/flutter-apk/app-release.apk
            apps/image_compressor/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
