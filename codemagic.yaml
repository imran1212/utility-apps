workflows:
  image-compressor-android:
    name: Image Compressor by SVSystem - Android APK and AAB
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Install Melos and bootstrap workspace
        script: |
          dart pub global activate melos 6.3.2
          export PATH="$HOME/.pub-cache/bin:$PATH"
          melos bootstrap

      - name: Generate Android project and configure SVSystem branding and AdMob
        script: |
          cd apps/image_compressor
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.utilityapps .
            # Remove Flutter's generated sample test, which references the old MyApp class.
            rm -f test/widget_test.dart
          fi
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          import re
          text = re.sub(r'android:label="[^"]+"', 'android:label="Image Compressor by SVSystem"', text, count=1)
          text = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/ic_sv_image_compressor"', text, count=1)

          # The device bugreport shows a launch-time crash inside WorkManager's
          # automatic Startup initializer while creating WorkDatabase. This app
          # does not schedule background work, so remove only WorkManager's
          # auto-initializer (keep AndroidX Startup and other initializers intact).
          if "xmlns:tools=" not in text:
              text = text.replace(
                  "<manifest ",
                  '<manifest xmlns:tools="http://schemas.android.com/tools" ',
                  1,
              )
          work_manager_override = """
              <provider
                  android:name="androidx.startup.InitializationProvider"
                  android:authorities="${applicationId}.androidx-startup"
                  android:exported="false"
                  tools:node="merge">
                  <meta-data
                      android:name="androidx.work.WorkManagerInitializer"
                      tools:node="remove" />
              </provider>
          """
          if "androidx.work.WorkManagerInitializer" not in text:
              text = text.replace("</application>", work_manager_override + "\\n    </application>")

          app_id_key = "com.google.android.gms.ads.APPLICATION_ID"
          if app_id_key not in text:
              meta = """
                  <!-- Google sample AdMob app ID. Replace before production release. -->
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713" />
              """
              text = text.replace("</application>", meta + "\n    </application>")
          manifest.write_text(text)

          icon = Path("android/app/src/main/res/drawable/ic_sv_image_compressor.xml")
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#082B63" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#0758C8" android:pathData="M8,8h92v92h-92z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M17,18h57a9,9 0,0 1,9 9v42a9,9 0,0 1,-9 9h-57a9,9 0,0 1,-9 -9v-42a9,9 0,0 1,9 -9z"/>
              <path android:fillColor="#43B7F4" android:pathData="M17,27h57v42h-57z"/>
              <path android:fillColor="#082B63" android:pathData="M17,60l17,-17 13,13 9,-10 18,23h-57z"/>
              <path android:fillColor="#FFC928" android:pathData="M57,33a7,7 0,1 0,14 0a7,7 0,1 0,-14 0"/>
              <path android:fillColor="#FFC928" android:pathData="M57,65h38a8,8 0,0 1,8 8v24a8,8 0,0 1,-8 8h-38a8,8 0,0 1,-8 -8v-24a8,8 0,0 1,8 -8z"/>
              <path android:fillColor="#082B63" android:pathData="M57,77c0,-5 4,-8 10,-8c4,0 7,1 9,3l-4,5c-2,-2 -3,-2 -5,-2c-2,0 -3,1 -3,2c0,4 13,1 13,10c0,5 -4,8 -11,8c-5,0 -9,-2 -11,-4l4,-5c2,2 5,3 7,3c2,0 3,-1 3,-2c0,-4 -12,-1 -12,-10zM78,70h7l5,16 5,-16h7l-9,24h-6z"/>
          </vector>
          """)
          PY

      - name: Generate 512x512 Play Store brand icon
        script: |
          python3 -m pip install --user cairosvg
          mkdir -p apps/image_compressor/build/branding
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url="apps/image_compressor/assets/branding/image_compressor_512.svg",
              write_to="apps/image_compressor/build/branding/image_compressor_512.png",
              output_width=512,
              output_height=512,
          )
          PY

      - name: Resolve app dependencies and analyze
        script: |
          cd apps/image_compressor
          flutter pub get
          flutter analyze

      - name: Build release APK
        script: |
          cd apps/image_compressor
          flutter build apk --release

      - name: Build release AAB
        script: |
          cd apps/image_compressor
          flutter build appbundle --release

    artifacts:
      - apps/image_compressor/build/branding/image_compressor_512.png
      - apps/image_compressor/build/app/outputs/flutter-apk/*.apk
      - apps/image_compressor/build/app/outputs/bundle/release/*.aab
      - apps/image_compressor/build/**/outputs/**/*.mapping.txt
      - /tmp/xcodebuild_logs/*.log
